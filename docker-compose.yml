services:
  db:
    image: postgis/postgis:16-3.4
    container_name: fit-pass-finder-db
    environment:
      POSTGRES_USER: fitpassfinder
      POSTGRES_PASSWORD: fitpassfinder_dev
      POSTGRES_DB: fitpassfinder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: